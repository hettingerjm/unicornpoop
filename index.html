<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#faf5ef">
    <meta name="description" content="A tiny rainbow trail arena by Sophia and John. Pick your unicorn, bring your pup, and outlast your rivals.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Unicorn Poop</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
    <div id="rotateOverlay">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">Rotate Your Device</div>
        <div class="rotate-sub">This game plays in landscape mode</div>
        <div class="rotate-tip">For fullscreen: tap <strong>Share</strong> ↗ then <strong>"Add to Home Screen"</strong></div>
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1280" height="720" aria-label="Unicorn Poop trail arena. Use arrow keys or WASD to steer, Space to burst, X to splat, and Escape to pause."></canvas>
    </div>
    <main id="menuUI" aria-label="Game menus"></main>
    <div id="liveHUD" hidden></div>
    <div id="arenaOverlay" hidden></div>
    <input id="saveImport" type="file" accept=".json,application/json" hidden aria-label="Choose a Unicorn Poop save file">
    <script src="game.js?v=5"></script>
    <script src="ui.js?v=5"></script>
</body>
</html>
